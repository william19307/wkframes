<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast column</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 14px/20px -apple-system, system-ui, sans-serif; background: #f7f7f8; color: #18181b; }
  .frame { position: relative; display: flex; flex-direction: column; height: 100%; }
  .tabs { flex: none; display: flex; gap: 20px; align-items: center; height: 44px; padding: 0 20px; border-bottom: 1px solid #e4e4e7; }
  .body { flex: 1; min-height: 0; }
  .list { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 12px 40px; padding: 24px 40px; box-sizing: border-box; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; }

  /* the component's own size: a 36px pill at the foot of the page */
  .toast { position: absolute; left: 50%; bottom: 20px; translate: -50% 0; display: flex; align-items: center; height: 36px;
           padding: 0 14px; border-radius: 12px; background: #1b1b1e; color: #fff; white-space: nowrap;
           animation: toast 2200ms ease both; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(12px); } 12%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

</style>
<!-- a layout sheet loaded later, at the same weight: "the page under the tabs fills the body" – and the toast with it.
     With ?fixed it leaves the toast alone (still the same weight for everything else). -->
<style id="layout">.body > * { height: 100%; }</style>
</head>
<body>
<div class="frame">
  <div class="tabs"><b>Apps</b><span>Skills</span></div>
  <div class="body" id="body">
    <div class="list">
      <div class="row">Calendar <button id="connect">Connect</button></div>
      <div class="row">Reminders <button>Connect</button></div>
      <div class="row">Mail <button>Connect</button></div>
      <div class="row">Notes <button>Connect</button></div>
    </div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).has("fixed")) document.getElementById("layout").textContent = ".body > :where(:not(.toast)) { height: 100%; }";
  document.getElementById("connect").addEventListener("click", () => {
    const t = document.createElement("div");
    t.className = "toast";
    t.setAttribute("role", "status");
    t.textContent = "✓ Calendar connected";
    document.getElementById("body").append(t); // like many apps: the toast is rendered next to the page content
    setTimeout(() => t.remove(), 2200);
  });
</script>
</body>
</html>
